include: package:flutter_lints/flutter.yaml

# Movere AI lint rules
# A few extra rules on top of flutter_lints for clean and consistent code.
linter:
  rules:
    prefer_const_constructors: true
    prefer_const_literals_to_create_immutables: true
    prefer_single_quotes: true
    always_declare_return_types: true
    avoid_print: true
    require_trailing_commas: true

analyzer:
  # Swift Package Manager vendors FlutterFire's own source (including its
  # test suite) into build/ios/SourcePackages/checkouts/ — that's not our
  # code and was showing up as thousands of false "errors". Excluding
  # build/ (and any other generated folder) keeps analyze focused on the
  # app itself.
  exclude:
    - build/**
    - "**/*.g.dart"
  errors:
    # Show missing required parameters as errors
    missing_required_param: error
    missing_return: error
