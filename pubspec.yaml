name: movere_ai
description: "Movere AI - A digital wellbeing, focus and awareness app"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.5.1

  # UI / Fonts
  google_fonts: ^6.2.1
  cupertino_icons: ^1.0.6

  # Local storage (Sprint 4)
  sqflite: ^2.3.3
  path_provider: ^2.1.3
  path: ^1.9.0

  # Usage insights: gercek/hazir dosya secici (native kod yazmaya gerek birakmiyor)
  file_picker: ^8.1.6

  # Podcast playback (Sprint 4): plays the bundled lesson episodes.
  just_audio: ^0.9.40

  # Onboarding illustrations: plays the looping Focus intro clip.
  video_player: ^2.9.2

  # Firebase Authentication (Sprint 4, second half): real sign-in/sign-up.
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  # cloud_firestore: ^4.17.4

  # Charts (Sprint 7)
  fl_chart: ^0.68.0

  # Localization (Sprint 15)
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/audio/
    - assets/onboarding/
    - assets/branding/
